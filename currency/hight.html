<div class="registration-container">
    <h1 class="main-heading">New patient registration</h1>
    <link href="hii.css" rel="stylesheet">
    <div class="outer-border">
        <div class="inner-form-box">
            <h2 class="inner-title">New patient form</h2>
            
            <div class="field-row">
                <label>Full name:</label>
                <input type="text">
            </div>

            <div class="field-row">
                <label>Age:</label>
                <input type="text" class="short-input">
            </div>

            <div class="field-row">
                <label>Gender:</label>
                <div class="radio-wrap">
                    <input type="radio" name="g" id="m"> <label for="m" class="blue-text">male</label>
                    <input type="radio" name="g" id="f"> <label for="f" class="blue-text">female</label>
                </div>
            </div>

            <div class="field-row">
                <label>Phone number:</label>
                <input type="text">
            </div>

            <div class="btn-group">
                <button class="form-btn">cancel</button>
                <button class="form-btn">submit</button>
            </div>
        </div>
    </div>
</div>
