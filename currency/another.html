
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="header-main">New patient registration</h1>

    <div class="green-container">
        <div class="form-wrapper">
            <h2 class="form-title">New patient form</h2>
            
            <form>
                <div class="input-row">
                    <label>Full name:</label>
                    <input type="text" class="text-input" required><br>
                </div>

                <div class="input-row">
                    <label>Age:</label>
                    <input type="text" class="text-input" required><br>
                </div>

                <div class="input-row">
                    <label>Gender:</label>
                    <div class="radio-options">
                        <input type="radio" id="male" name="gen" required><label for="male">male</label>
                        <input type="radio" id="female" name="gen"required><label for="female">female</label>
                    </div>
                </div>

                <div class="input-row">
                    <label>Phone number:</label>
                    <input type="text" class="text-input" required>
                </div><br>

                <div class="actions">
                    <button type="button" class="btn">cancel</button>&nbsp;&nbsp;&nbsp;
                    <button type="submit" class="btn">submit</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
