<div class="settings-container">
  <h2>Settings</h2>
  <hr>

  <div class="setting-item">
    <label for="theme-toggle">Theme (Dark/Light Mode)</label>
    <div class="toggle-switch">
      <input type="checkbox" id="theme-toggle">
      <span class="slider"></span>
    </div>
  </div>

  <div class="setting-item">
    <label for="language-select">Default Language</label>
    <select id="language-select">
      <option value="en" selected>English</option>
      <option value="rw">Kinyarwanda</option>
      <option value="fr">French</option>
    </select>
  </div>

  <div class="setting-item">
    <label for="notif-optional">Enable Notifications</label>
    <input type="checkbox" id="notif-optional">
    <span class="sub-text">(This is optional)</span>
  </div>
</div>
